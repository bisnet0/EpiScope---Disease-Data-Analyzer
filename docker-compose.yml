services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: episcope_front
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - episcope-net
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demas_api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - episcope-net
    volumes:
      - ./backend:/app/backend
      - backend_model_artifacts:/app/model_artifacts

  db:
    image: postgres:13
    container_name: episcope_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - episcope-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_gui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - episcope-net
    volumes:
      - pgadmin_data:/var/lib/pgadmin 

  ganache:
    image: trufflesuite/ganache:latest
    container_name: episcope_blockchain
    ports:
      - "8545:8545"
    command:
      [
        "--wallet.seed",
        "episcope_dapp",
        "--chain.chainId",
        "31337",
        "--wallet.totalAccounts",
        "1",
        "--wallet.defaultBalance",
        "10000",
        "--host",
        "0.0.0.0",
      ]
    restart: unless-stopped
    networks:
      - episcope-net

volumes:
  postgres_data:
  pgadmin_data:
  backend_model_artifacts:

networks:
  episcope-net:
    driver: bridge

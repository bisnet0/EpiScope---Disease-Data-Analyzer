# 1. Redireciona tudo de HTTP para HTTPS
server {
    listen 80;
    server_name episcope.com.br www.episcope.com.br;
    
    return 301 https://$host$request_uri;
}

# 2. O Servidor Seguro Principal
server {
    listen 443 ssl;
    server_name episcope.com.br www.episcope.com.br;
    client_max_body_size 500M;

    # Aponta para os certificados que criamos no Ubuntu
    ssl_certificate /etc/letsencrypt/live/episcope.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/episcope.com.br/privkey.pem;

    # Configurações de segurança recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Roteamento do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Python (Backend)
    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Avisa o Python que a conexão é HTTPS
    }
}